[project]
name = "kag-bridge"
version = "0.1.0"
description = "KAG Bridge — MCP server exposing KAG reasoning as agent-loop tools (KAGWeb integration, design docs/kag-integration-design.md §5.1/附录 A)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
# KAG 运行时（重依赖，按需安装；本地开发可用源码 venv）
kag = ["openspg-kag>=0.8.0"]

[project.scripts]
kag-bridge = "kag_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kag_bridge"]
