# KAGWeb on Kubernetes — component-split stack
#
# One pod, three containers, one image:
#   backend    KAGWEB_COMPONENT=backend   FastAPI (:8082) + the data PVC
#   frontend   KAGWEB_COMPONENT=frontend  Next.js (:8092). It mounts ONLY
#              data/user/settings, read-only: the entrypoint exports
#              KAGWEB_AUTH_ENABLED / KAGWEB_API_BASE_URL from those
#              JSONs, and a frontend without them would re-seed defaults
#              (auth=false) and disagree with the backend's auth gate. For the
#              API base the seeded default resolves to http://127.0.0.1:8082
#              (same pod network namespace) when the settings leave it blank.
# Shape notes (see the review in the PR that added this file):
#   * replicas is pinned to 1 with strategy Recreate: /app/data is a
#     SQLite-bearing tree on a ReadWriteOnce volume, so it cannot follow a
#     rolling update and cannot be shared by two replicas. Scale the backend
#     up in-process instead (system.json backend_workers + a redis deployment).
#   * Model/provider keys are entered through the web Settings page and live
#     in the PVC (data/user/settings/*.json). To pre-seed them, unmount the
#     settings dir from the PVC and mount a Secret instead — do not commit
#     them here.
#   * redis is only required for backend_workers > 1; single-worker mode uses
#     an in-process coordinator whose health() is always true.
#
# Usage:
#   kubectl apply -k deploy/k8s
#
# Prerequisite: the kagweb image comes from GHCR.
apiVersion: v1
kind: Namespace
metadata:
  name: kagweb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kagweb-data
  namespace: kagweb
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: <your-storage-class>
---
apiVersion: v1
kind: Service
metadata:
  name: kagweb
  namespace: kagweb
  # The backend port is published for remote-server deployments where the
  # browser calls the API directly (system.json next_public_api_base_external).
  # Local/browser-through-frontend-only deployments can drop it.
spec:
  selector:
    app: kagweb
  ports:
    - name: frontend
      port: 8092
      targetPort: 8092
    - name: backend
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagweb
  namespace: kagweb
spec:
  replicas: 1
  strategy:
    # A ReadWriteOnce volume cannot attach to the old and new pod at once.
    type: Recreate
  selector:
    matchLabels:
      app: kagweb
  template:
    metadata:
      labels:
        app: kagweb
    spec:
      # The image bakes a kagweb user at UID/GID 1000 and supervisord
      # drops each program to it; fsGroup gives the PVC-owned files the same
      # group so the entrypoint's (conditional) chown becomes a no-op.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      initContainers:
        # First-start directory/settings bootstrap, exactly once per volume,
        # so the app containers' own (idempotent) init never races.
        - name: init-data
          image: ghcr.io/YOUR_KAGWEB_ORG/kagweb:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - python
            - -c
            - >-
              from pathlib import Path;
              from kagweb.services.setup import init_user_directories;
              init_user_directories(Path('/app'))
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        # ---------------- backend ----------------
        - name: backend
          image: ghcr.io/YOUR_KAGWEB_ORG/kagweb:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: KAGWEB_COMPONENT
              value: backend
          ports:
            - name: backend
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health/ready
              port: backend
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: backend
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: backend
            failureThreshold: 12
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              # Room for document parsing and model tooling; tighten to taste.
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
        # ---------------- frontend ----------------
        - name: frontend
          image: ghcr.io/YOUR_KAGWEB_ORG/kagweb:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: KAGWEB_COMPONENT
              value: frontend
          ports:
            - name: frontend
              containerPort: 8092
          readinessProbe:
            httpGet:
              path: /
              port: frontend
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: frontend
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # Read-only settings so the entrypoint's auth / API-base exports
            # track what the backend reads from the same PVC (initContainer
            # guarantees the files exist before this container starts).
            - name: data
              mountPath: /app/data/user/settings
              subPath: user/settings
              readOnly: true
            - name: tmp-frontend
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kagweb-data
        # Separate /tmp per app container: each runs its own supervisord with
        # pidfile=/tmp/supervisord.pid — a shared volume made the two daemons
        # fight over one pidfile across PID namespaces (sporadic "another
        # program is already running" startup failures).
        - name: tmp
          emptyDir: {}
        - name: tmp-frontend
          emptyDir: {}
